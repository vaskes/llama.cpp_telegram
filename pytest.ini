# pytest.ini
[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -s used to be here. It disabled pytest's capture for the whole
# suite, so every test's stdout landed in the CI log as if it were
# the test's own output -- noise that hides the one line that
# matters when something fails. Capture is on; a test that wants
# to show output asks for it by name.
addopts = -v
pythonpath = telegram-bot tests

markers =
    tech_debt: pins an item in docs/tech-debt/ (reconciled by scripts/tech_debt_sync.py)
