services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    init: true
    # 2026-10-13: switch from lan_macvlan (static 192.168.10.5) to
    # host network. The previous macvlan setup existed for PBR / DNAT
    # routing reasons that are no longer in use; today, the only
    # consumer of the bot's webhook address is nginx on the same
    # host, which forwards bot.kuduza.com:443 -> host_ip:8443.
    #
    # With network_mode: host, the python process binds 0.0.0.0:8443
    # on the host's interfaces directly. The `ports:` directive is
    # ignored in this mode (Docker does not publish ports when the
    # container is sharing the host network stack).
    #
    # Why host network instead of bridge: the bot must reach the
    # vaskes/OpenWebUI-bash-sandbox openapi-proxy at 192.168.10.7:8090
    # (the side-car binds only to that LAN IP, not 0.0.0.0, by
    # design). Inside host network, 192.168.10.7 is just the host's
    # own LAN address and is reachable from the bot's process.
    # Inside bridge, the bot would have to go through the bridge
    # gateway (172.17.0.1) which is not bound for 8090. We chose
    # NOT to touch the agent-stack compose (different repo, different
    # owner) just to widen its bind address.
    network_mode: host
    env_file:
    - .env
    environment:
    - PYTHONUNBUFFERED=1
    # 2026-10-13: AGENT_STACK_URL points at the openapi-proxy LAN
    # bind. From inside host network this is a loopback-ish
    # call to the same machine; the openapi-proxy is reachable on
    # 192.168.10.7 (host LAN IP). If the side-car is later moved,
    # change this to its new address.
    - AGENT_STACK_URL=http://192.168.10.7:8090
    command:
    - sh
    - -c
    - exec python -u bot.py 2>&1 | stdbuf -oL tee -a /var/log/bot/bot.log
    volumes:
    - ./files:/app/files
    - ./data:/app/data
    - /var/log/telegram-bot:/var/log/bot
    - ./personal_tools:/app/personal_tools
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
