services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    # W3.1: `init: true` makes Docker use tini as PID 1. tini's
    # job is to forward signals to children and reap zombies.
    # Without it, our `command: sh -c "python ... | tee ..."` made
    # `sh` the PID 1, and `sh` does not forward SIGTERM to the
    # python process in the pipeline. `docker stop` (which sends
    # SIGTERM, waits 10s, then SIGKILL) was therefore killing
    # python without giving it a chance to flush, close the SQLite
    # db, or run any in-flight LLM abort path. The SHUTDOWN_EVENT
    # check in call_llama (which aborts a long reasoning run
    # cleanly on user /stop) was effectively unreachable from
    # `docker stop`. With tini, SIGTERM hits the python process
    # and the abort path works as designed.
    init: true
    networks:
      lan_macvlan:
        ipv4_address: 192.168.10.5
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # Override CMD: pipe through `tee` so logs are BOTH:
    #   1. visible in `docker logs telegram-bot` (docker's json-file
    #      driver captures the pipe's stdout)
    #   2. appended to /var/log/bot/bot.log on the host (bind-mount)
    # `python -u` sets unbuffered at the interpreter level; `tee`
    # would otherwise block-buffer its stdout, defeating the purpose.
    # `stdbuf -oL` forces line-buffering on tee (otherwise coreutils
    # tee uses 4KB block buffering on stdout even when stdin is a
    # pipe).
    #
    # Why bind-mount instead of just docker's json-file driver:
    # `docker compose up -d --force-recreate` (used by the systemd
    # ExecReload) creates a new container with a new ID; the old
    # container's json-file log is left orphaned in
    # /var/lib/docker/containers/<old_id>/ and `docker logs
    # telegram-bot` (which addresses by container_name -> the
    # current ID) silently hides it. With a bind-mount to
    # /var/log/bot on the host, every recreate appends to the same
    # file on the host; the operator can `tail -F
    # /var/log/telegram-bot/bot.log` and never lose a line to a
    # restart.
    #
    # On the host, /var/log/telegram-bot must be owned by uid 1000
    # (matching the `bot` user in the Dockerfile). A named volume
    # would let Docker handle the ownership, but bind-mount keeps
    # the log file on the host filesystem where it can be tailed
    # from outside the container and rotated by the host logrotate.
    command:
      - sh
      - -c
      - "exec python -u bot.py 2>&1 | stdbuf -oL tee -a /var/log/bot/bot.log"
    volumes:
      - ./files:/app/files
      - ./data:/app/data
      - /var/log/telegram-bot:/var/log/bot
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  lan_macvlan:
    external: true
