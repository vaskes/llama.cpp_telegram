services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    init: true
    # 2026-10-13: switch from lan_macvlan (static 192.168.10.5) to
    # host network. The previous macvlan setup existed for PBR / DNAT
    # routing reasons that are no longer in use; today, the only
    # consumer of the bot's webhook address is nginx on the same
    # host, which forwards bot.kuduza.com:443 -> host_ip:8443.
    #
    # With network_mode: host, the python process binds 0.0.0.0:8443
    # on the host's interfaces directly. The `ports:` directive is
    # ignored in this mode (Docker does not publish ports when the
    # container is sharing the host network stack).
    #
    # Why host network instead of bridge: the bot must reach the
    # vaskes/OpenWebUI-bash-sandbox openapi-proxy on the same host
    # (the side-car binds only to that LAN IP, not 0.0.0.0, by
    # design). Inside host network, that address is just the host's
    # own LAN address and is reachable from the bot's process.
    # Inside bridge, the bot would have to go through the bridge
    # gateway (172.17.0.1) which is not bound for 8090. We chose
    # NOT to touch the agent-stack compose (different repo, different
    # owner) just to widen its bind address.
    network_mode: host
    env_file:
    - .env
    environment:
    - PYTHONUNBUFFERED=1
    # T63: was hardcoded to 192.168.10.7 - one specific host of one
    # specific deployment, which then went away and left this file
    # pointing at nothing. The side-car runs on whatever host runs it,
    # so default to loopback and let the environment override:
    #   AGENT_STACK_URL=http://lan-ip:8090 docker compose up -d
    - AGENT_STACK_URL=${AGENT_STACK_URL:-http://127.0.0.1:8090}
    command:
    - sh
    - -c
    - exec python -u bot.py 2>&1 | stdbuf -oL tee -a /var/log/bot/bot.log
    volumes:
    - ./files:/app/files:ro  # T52 #R2: no bot code writes here; ro closes the host-side writable surface
    # T52 #R2: replaced host bind-mount with a named Docker
    # volume. The bind-mount was a host-side writable surface:
    # a host RCE, an operator typo (rm -rf ./data), or a
    # misconfigured cron could wipe or tamper the SQLite.
    # A named volume is owned by Docker and not visible on the
    # host filesystem; the bot inside the container still has
    # read/write, so functional behaviour is unchanged.
    # Migration: docker run --rm -v bot_data:/target -v
    # /opt/telegram-bot/data:/source alpine cp -a /source/. /target/
    - bot_data:/app/data
    - /var/log/telegram-bot:/var/log/bot
    - ./personal_tools:/app/personal_tools:ro
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

# T52 #R2: named volume for the SQLite conversation store.
# Persists across container recreates; not visible on the host
# filesystem (Docker-owned). See comment on the volume mount
# above for the migration step on first deploy.
volumes:
  bot_data:
