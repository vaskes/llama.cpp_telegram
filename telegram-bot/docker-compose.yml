services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    # macvlan network: stable IP, reachable from a reverse-proxy
    # container on the same macvlan. For single-host dev, switch
    # to network_mode: host and remove the networks block.
    networks:
      lan_macvlan:
        ipv4_address: 192.168.X.Y
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./files:/app/files
      - ./data:/app/data

networks:
  lan_macvlan:
    external: true
