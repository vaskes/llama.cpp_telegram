# requirements.lock -- the exact package set the image installs.
#
# requirements.txt names the three DIRECT dependencies
# (python-telegram-bot, httpx, aiohttp). Everything they pull in was
# resolved at build time, so a rebuild a month later could install
# different versions of the transitives: the three pins were exact and
# the other fourteen were whatever the index said that day.
#
# Generated 2026-10-30 on Python 3.11 (the version the image runs):
#
#   python -m venv /tmp/lock && /tmp/lock/bin/pip install \
#       -r telegram-bot/requirements.txt && /tmp/lock/bin/pip freeze
#
# The image installs THIS FILE (see the Dockerfile), so the set the
# container runs is this list by construction -- not a fresh
# resolution that happens to look similar. After a deploy, check it
# against the running container with:
#
#   docker exec tb-bot pip list --format=freeze
#
# To change a dependency: change requirements.txt, re-resolve, and
# regenerate this file in the same commit. tests/test_requirements_lock.py
# fails if the two disagree.
