name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    # History, because the shape of this job is a decision and not an
    # accident:
    #
    #   * it used to be `continue-on-error: true` plus `--exit-zero`,
    #     checking one file (telegram-bot/bot.py) with the W subset --
    #     a job that could not fail, so it never did;
    #   * then it checked the whole package, but kept
    #     continue-on-error, so it reported and did not gate;
    #   * 2026-10-28: the job gates on the rules that catch code which
    #     would not run (E9 syntax, F63 comparison, F7 syntax, F82
    #     undefined name), and reports the stylistic tail separately.
    #
    # The tail is ~566 findings (ruff 0.17.2, default rule set) of
    # pre-existing F401/E501 and friends. Blocking on those would mean
    # either 566 noqa comments or silencing the job again -- the state
    # this job just escaped. So the split is: the error-class rules
    # decide whether a push lands, the stylistic tail is reported in
    # the log. Measured on 2026-10-28: the gate's rule set is clean
    # ("All checks passed!" on ruff 0.17.2).
    runs-on: ubuntu-latest
    # v0.8.2: explicit minimum-privilege permissions. CodeQL
    # flagged 'actions/missing-workflow-permissions' (CWE-275)
    # because the workflow had no permissions block, so the
    # default token scope was used (read-write). With this block
    # the GITHUB_TOKEN can only read repo contents - cannot
    # push, create issues, or write packages. Future steps
    # that need write access must opt in explicitly.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The gate. This step decides whether the push lands.
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --select E9,F63,F7,F82 telegram-bot/
      # The tail: reported, not gating. The finding count is a number
      # that changes whenever a dependency or a file moves, so it lives
      # in the log, not in this file.
      - uses: astral-sh/ruff-action@v3
        continue-on-error: true
        with:
          args: check telegram-bot/

  pytest:
    # T53 #R7: pytest job to catch integration-level bugs that
    # unit tests miss. The T52 #H1 commit broke the bot in
    # production because every test that called handlers.call_llama
    # monkey-patched the function, so the real signature was
    # never exercised. A pytest job on every push would have
    # caught it (the failing test_tag_sender_list_content_vision
    # was the only signal). Gate on this: no green pytest, no
    # merge to main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Production runs python:3.11-slim (telegram-bot/Dockerfile). A
        # 3.12-only suite is a suite that has never tested what it ships.
        #
        # Nine PEP 701 f-strings in test_shell_integration.py lived through
        # several review waves for exactly this reason: they parse on 3.12
        # and are a SyntaxError on 3.11. The version-sensitive tripwires
        # (test_python_version_compat.py) cannot be honest from one side
        # only -- the pre312 scan skips itself on 3.12 -- so the 3.11 job is
        # not redundant, it is the other half of the coverage.
        #
        # 3.14 joined on 2026-10-28 because the tree was broken there and
        # nothing said so: a docstring in tests/test_c4_thinking.py carried
        # surrogate escapes, and 3.14 encodes docstrings to UTF-8 -- the
        # whole file failed to compile, 28 tests were silently lost, and
        # the README's test badge was off by exactly that many. Measured on
        # 3.14.10: 2902 collected, 1 collection error. The suite now runs
        # on 3.14, so the next version break is a red job instead of a
        # quiet loss.
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock, not requirements.txt: the lock pins the whole set
          # (the three direct dependencies and their transitives), so the
          # suite runs against the versions the image ships. httpx is
          # pinned there; the bare `pip install httpx` that used to sit
          # on the next line silently upgraded it to whatever was latest
          # (0.28.1), so the version under test was not the version that
          # ships. The test tooling installs without touching it.
          pip install -r telegram-bot/requirements.lock
          pip install pytest pytest-asyncio
          # What the job actually tested, printed. A red job whose versions
          # are unrecorded costs a rerun before it can be diagnosed.
          python -c "import sys, httpx, telegram, pytest, pytest_asyncio; \
            print(sys.version); \
            print('httpx', httpx.__version__); \
            print('telegram', telegram.__version__); \
            print('pytest', pytest.__version__); \
            print('pytest-asyncio', pytest_asyncio.__version__)"
      - name: Run tests that do not need a live llama-server
        env:
          CONVERSATIONS_DB: /tmp/pytest.db
          AGENT_STACK_TOKEN: ""
        run: |
          # Run everything that is not a live-sandbox test; they are run
          # manually on a staging host before tagging stable.
          #
          # test_shell_integration.py needs a live
          # vaskes/OpenWebUI-bash-sandbox side-car that CI does not have.
          # The comment that used to sit HERE, between the line-continuation
          # and --ignore, is why this job had never once passed: the backslash
          # bound only the comment, so pytest ran as `pytest tests/` and
          # `--ignore=...` was then executed as a command of its own --
          # "No such file or directory", exit 127, after 2029 passing tests.
          # A comment inside a backslash continuation is not a comment.
          pytest tests/ \
              --ignore=tests/test_shell_integration.py \
              -q --tb=short
