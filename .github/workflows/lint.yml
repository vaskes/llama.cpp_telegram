name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    # Previously: `continue-on-error: true` plus `--exit-zero`, checking one
    # file (telegram-bot/bot.py) with the W subset. That is not a lint job.
    # It could not fail, so it never did, so it taught nobody anything --
    # and the W subset it checked is clean everywhere in the tree.
    #
    # Now: the whole package, with the set ruff itself documents as
    # CI-appropriate for a codebase that is not yet ruff-clean. E9 (syntax),
    # F63/F7/F82 (comparison, syntax, undefined name) are the rules that
    # catch code which would not run. The stylistic tail stays off until the
    # ~150 pre-existing F401/F841/E501 findings are actually dealt with --
    # blocking on those would mean either committing 150 noqa comments or
    # silencing the job again, which is the state this job just escaped.
    #
    # Verified against ruff 0.17: `All checks passed!` on telegram-bot/.
    #
    # Advisory, deliberately, and kept that way on purpose. Removing
    # continue-on-error to "make the job real" blocked pushes on a lint
    # finding, which is the wrong trade: ruff findings here are cosmetic,
    # and a blocked push costs more than a W605. So the job reports and does
    # not gate.
    #
    # What did change is that it can now actually report something: it
    # checks the whole package rather than one file, and --exit-zero is
    # gone, so ruff returns its real exit code and the findings reach the
    # log. Advisory about *blocking*, honest about *checking*.
    continue-on-error: true
    runs-on: ubuntu-latest
    # v0.8.2: explicit minimum-privilege permissions. CodeQL
    # flagged 'actions/missing-workflow-permissions' (CWE-275)
    # because the workflow had no permissions block, so the
    # default token scope was used (read-write). With this block
    # the GITHUB_TOKEN can only read repo contents - cannot
    # push, create issues, or write packages. Future steps
    # that need write access must opt in explicitly.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Was: `--select W --exit-zero telegram-bot/bot.py`, on a job
          # marked continue-on-error. Two independent reasons it could not
          # fail, so it never reported anything. The W subset it checked is
          # clean across the whole tree anyway -- verified on ruff 0.17.
          #
          # Now: the entire package, on the rules that catch code which
          # would not run. The stylistic tail (F401, E501, BLE001 -- ~150
          # pre-existing findings) stays off until someone deals with them;
          # blocking on those means either 150 noqa comments or silencing
          # the job again, which is what this just stopped doing.
          args: check --select E9,F63,F7,F82 telegram-bot/

  pytest:
    # T53 #R7: pytest job to catch integration-level bugs that
    # unit tests miss. The T52 #H1 commit broke the bot in
    # production because every test that called handlers.call_llama
    # monkey-patched the function, so the real signature was
    # never exercised. A pytest job on every push would have
    # caught it (the failing test_tag_sender_list_content_vision
    # was the only signal). Gate on this: no green pytest, no
    # merge to main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Production runs python:3.11-slim (telegram-bot/Dockerfile). A
        # 3.12-only suite is a suite that has never tested what it ships.
        #
        # Nine PEP 701 f-strings in test_shell_integration.py lived through
        # several review waves for exactly this reason: they parse on 3.12
        # and are a SyntaxError on 3.11. The version-sensitive tripwires
        # (test_python_version_compat.py) cannot be honest from one side
        # only -- the pre312 scan skips itself on 3.12 -- so the 3.11 job is
        # not redundant, it is the other half of the coverage.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx is pinned in requirements.txt. The bare `pip install httpx`
          # that used to sit on the next line silently upgraded it to
          # whatever was latest (0.28.1), so the version under test was not
          # the version that ships. Reinstalling it pinned, and the test
          # tooling installs without touching it.
          pip install -r telegram-bot/requirements.txt
          pip install pytest pytest-asyncio
          # What the job actually tested, printed. A red job whose versions
          # are unrecorded costs a rerun before it can be diagnosed.
          python -c "import sys, httpx, telegram, pytest, pytest_asyncio; \
            print(sys.version); \
            print('httpx', httpx.__version__); \
            print('telegram', telegram.__version__); \
            print('pytest', pytest.__version__); \
            print('pytest-asyncio', pytest_asyncio.__version__)"
      - name: Run tests that do not need a live llama-server
        env:
          CONVERSATIONS_DB: /tmp/pytest.db
          AGENT_STACK_TOKEN: ""
        run: |
          # Run everything that is not a live-sandbox test.
          # The live-sandbox tests (test_shell_integration.py)
          # require a running vaskes/OpenWebUI-bash-sandbox
          # side-car, which CI does not have. They are run
          # manually on a staging host before tagging stable.
          pytest tests/ \
              # test_shell_integration.py still needs a live
              # vaskes/OpenWebUI-bash-sandbox side-car that CI does not
              # have. Both limits/test_selftest quarantines are gone
              # (came from c11b9cb, removed across 9b9b85a / 4327e4b /
              # this commit after the W6 review measured they pass).
              --ignore=tests/test_shell_integration.py \
              -q --tb=short
