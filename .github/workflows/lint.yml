name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    # Pre-existing findings (F841, E501, BLE001, F401, ...) total
    # ~150 against ruff 0.17 (latest, what astral-sh/ruff-action@v1
    # installs). The bot codebase was written against ruff 0.5/0.6
    # and predates the stricter rules. Until the codebase is
    # brought up to ruff-current in v0.11+, the lint job runs
    # in advisory mode: it reports findings to the Actions log
    # but does not block merges.
    continue-on-error: true
    runs-on: ubuntu-latest
    # v0.8.2: explicit minimum-privilege permissions. CodeQL
    # flagged 'actions/missing-workflow-permissions' (CWE-275)
    # because the workflow had no permissions block, so the
    # default token scope was used (read-write). With this block
    # the GITHUB_TOKEN can only read repo contents - cannot
    # push, create issues, or write packages. Future steps
    # that need write access must opt in explicitly.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          # The codebase predates ruff 0.6; running the full
          # default rule set (E + F + B + ...) produces ~150
          # findings, all pre-existing. The bot's `try: # noqa`
          # pattern relies on bare noqa, which ruff 0.6+ flags
          # with RUF100 ("Invalid '# noqa' directive"). Until
          # the codebase is brought up to ruff-current, we
          # only run the W (warning) subset, which catches the
          # noqa-format regression without breaking the build
          # on unrelated pre-existing findings.
          args: check --select W --exit-zero telegram-bot/bot.py

          # --exit-zero: the codebase has ~150 pre-existing ruff
          # findings (F841, E501, BLE001, F401) from before the
          # ruff 0.6 baseline. Until T29/T30 land in v0.11, we
          # suppress the non-zero exit so GitHub does not email
          # the operator on every push (GitHub notifies per-step,
          # not per-job, so 'continue-on-error: true' on the job
          # was not enough). Findings are still visible in the
          # Actions log.

  pytest:
    # T53 #R7: pytest job to catch integration-level bugs that
    # unit tests miss. The T52 #H1 commit broke the bot in
    # production because every test that called handlers.call_llama
    # monkey-patched the function, so the real signature was
    # never exercised. A pytest job on every push would have
    # caught it (the failing test_tag_sender_list_content_vision
    # was the only signal). Gate on this: no green pytest, no
    # merge to main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Production runs python:3.11-slim (telegram-bot/Dockerfile). A
        # 3.12-only suite is a suite that has never tested what it ships.
        #
        # Nine PEP 701 f-strings in test_shell_integration.py lived through
        # several review waves for exactly this reason: they parse on 3.12
        # and are a SyntaxError on 3.11. The version-sensitive tripwires
        # (test_python_version_compat.py) cannot be honest from one side
        # only -- the pre312 scan skips itself on 3.12 -- so the 3.11 job is
        # not redundant, it is the other half of the coverage.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram-bot/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests that do not need a live llama-server
        env:
          CONVERSATIONS_DB: /tmp/pytest.db
          AGENT_STACK_TOKEN: ""
        run: |
          # Run everything that is not a live-sandbox test.
          # The live-sandbox tests (test_shell_integration.py)
          # require a running vaskes/OpenWebUI-bash-sandbox
          # side-car, which CI does not have. They are run
          # manually on a staging host before tagging stable.
          pytest tests/ \
              # Note: tests/test_limits.py and tests/test_selftest.py
              # still sit on the --ignore list as legacy from commit
              # c11b9cb ("Pre-existing 2 fails: test_limits,
              # test_selftest (both PYTHONPATH issues)"). Step 1 of the
              # W6 cleanup removes test_limits now that 14 tests are
              # green again; test_selftest follows after step 2 (the
              # conftest session-unique tmp dir fix lands separately).
              --ignore=tests/test_shell_integration.py \
              --ignore=tests/test_selftest.py \
              -q --tb=short
