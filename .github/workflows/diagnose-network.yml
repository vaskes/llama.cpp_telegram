name: Diagnose the runner's network

# TEMPORARY diagnostic (2026-10-27). The deploy workflow could not reach
# the production host: "ssh: connect to host 85.136.112.144 port ***:
# Connection timed out". This measures what the runner CAN reach, so
# the next step is a decision and not a guess.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: What does the runner see
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The runner's own address
        run: |
          echo "egress: $(curl -s -m 15 https://api.ipify.org || echo unknown)"

      - name: The ports of the production host
        run: |
          for p in 22 80 443 3000 8080 8443 12006 12007; do
            if timeout 6 bash -c "echo > /dev/tcp/85.136.112.144/$p" 2>/dev/null; then
              echo "$p OPEN"
            else
              echo "$p no answer"
            fi
          done
