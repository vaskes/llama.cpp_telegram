name: Deploy

# A tag is a release. The tag names the commit that carries its
# CHANGELOG section (see the release contract in the CODEBOOK), and
# pushing it is the operator's own action -- so the tag IS the approval.
#
# The deploy itself belongs to the host: the script that runs there
# (/opt/telegrambot/deploy_bot.sh) holds the topology -- the compose
# file, the .env, the volume -- and it is the same script the operator
# runs by hand. This workflow only says WHEN to run it and HOW to
# check the result, so a CI deploy and a hand deploy cannot drift
# apart.
#
# The key in the repository's secrets is limited to that one script:
# sshd runs it with a forced command, and the client's command line
# reaches it as data in $SSH_ORIGINAL_COMMAND, not as a shell command.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to deploy: a commit sha, a tag, or a branch'
        required: true
        default: 'main'

permissions:
  contents: read

# One deploy at a time. Two builds racing for the same directory on the
# host would interleave their rsync and their container replace.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the production host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out what is being deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: The commit to deploy
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Can this runner reach the host?
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          # The host is behind the operator's router, and the router is
          # what decides whether a runner can reach it. A timeout here
          # says nothing about the key, so the address is printed and
          # the reason is named -- otherwise the failure reads as a
          # broken deploy.
          host="${DEPLOY_HOST##*@}"
          echo "this runner's address: $(curl -s -m 15 https://api.ipify.org || echo unknown)"
          if timeout 10 bash -c "echo > /dev/tcp/$host/$DEPLOY_PORT" 2>/dev/null; then
            echo "the host answered on $host:$DEPLOY_PORT"
          else
            echo "::error::the host did not answer on $host:$DEPLOY_PORT from this runner"
            echo "The production host is behind a router that opens only 80 and 443 to the outside."
            echo "The deploy key is fine; the port is not open to this address."
            exit 1
          fi

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host's key is pinned, not discovered: a workflow that
          # accepts whatever answers the port is a workflow that
          # deploys to whoever answered.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # The sha is the last argument, and the host's forced command
          # reads it as $SSH_ORIGINAL_COMMAND -- data, not a command.
          ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_HOST" "${{ steps.sha.outputs.sha }}"
