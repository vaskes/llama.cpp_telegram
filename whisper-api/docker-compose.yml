services:
  whisper-api:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper-api
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=Systran/faster-distil-whisper-large-v3
    volumes:
      - ./cache:/root/.cache
    networks:
      lan_macvlan:
        ipv4_address: 192.168.10.3

networks:
  lan_macvlan:
    external: true
